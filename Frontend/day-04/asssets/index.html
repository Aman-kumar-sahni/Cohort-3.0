<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loomé UI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo">loomé.</div>

    <ul class="nav-links">
      <li>Home</li>
      <li class="active">Shop</li>
      <li>Collection</li>
      <li>About</li>
      <li>Contact</li>
    </ul>

    <div class="icons">
      <!-- Add cart icon -->
      <span>🛍️</span>
      <!-- Add menu icon -->
      <span>☰</span>
    </div>
  </nav>

  <!-- MAIN SECTION -->
  <section class="main">

    <!-- LEFT CONTENT -->
    <div class="left">

      <p class="tag">🌿 NEW COLLECTION</p>

      <h1>a cotton <br> weave</h1>

      <p class="desc">
        <!-- Replace with your text -->
        Crafted from 100% organic cotton with a soft, breathable feel.
      </p>

      <!-- COLORS -->
      <div class="colors">
        <span class="c1"></span>
        <span class="c2"></span>
        <span class="c3"></span>
      </div>

      <!-- DETAILS -->
      <div class="details">
        <h3>Details</h3>
        <p>
          <!-- Replace with your text -->
          Lorem ipsum dolor sit amet consectetur adipisicing elit.
        </p>
      </div>

    </div>

    <!-- RIGHT IMAGE -->
    <div class="right">

      <!-- Main Image -->
      <img src="your-image.jpg" alt="product">
      <!-- ↑ yaha apni image daalo -->

      <!-- PRICE -->
      <div class="price">$488</div>

      <!-- RATING -->
      <div class="rating">★★★★★</div>

      <!-- ADD TO BAG -->
      <button class="btn">Add to bag</button>

    </div>

  </section>

</body>
</html>
